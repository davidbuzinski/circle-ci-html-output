# This workflow runs a matrix build with both versions of setup MATLAB action
name: MATLAB matrix build

# Controls when the action will run.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        # Run this workflow on different os
        os: [ubuntu-latest]
        release: [r2020b, r2021a, r2021b, r2022a, r2022b, r2023a]
      fail-fast: false
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v6
      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.release }}
      - name: Run Tests
        uses: matlab-actions/run-tests@v3.2.1
        with:
          source-folder: code
          select-by-folder: tests
          test-results-junit: test.xml
          code-coverage-cobertura: coverage.xml
